<script>
  // Group invite links look like getnotfussed.com/g/K7QF3. GitHub Pages has no page at that address,
  // so it lands here: send it on to the group page with the code.
  (function () {
    var m = location.pathname.match(/^\/g\/([A-Za-z0-9]{3,8})\/?$/);
    if (m) location.replace('/g/?c=' + m[1].toUpperCase());
  })();
</script>
